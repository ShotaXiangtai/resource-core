# resource-core 設定ファイル
# 編集しなくてもすべての機能が動きます。変更後は /resource-core reload で反映されます。

# 資源ワールドの設定
#   key         : ワールドのキー。Worlds は同じ namespace のワールド同士をポータルで連携するため、
#                 3 つとも同じ namespace にしてください。minecraft 名前空間は使えません。
#   seed        : 新規作成するときの seed。空ならランダム。数値以外の文字列はバニラと同じく hashCode を使います。
#   change-seed : リセットごとに新しいランダム seed にするか。false なら同じ seed で初期状態へ戻します。
#                 （管理 GUI からも切り替えられます）
worlds:
  overworld:
    key: "resource:overworld"
    seed: ""
    change-seed: true
  nether:
    key: "resource:nether"
    seed: ""
    change-seed: true
  end:
    key: "resource:the_end"
    seed: ""
    change-seed: true

# ワールドボーダー（中心は 0, 0）
border:
  # オーバーワールドとエンドの半径（ブロック）。ネザーはこの 8 分の 1 になります（10000 なら 1250）。
  radius: 10000

# Chunky による事前生成（Chunky プラグインが必要です。無ければ事前生成だけ行いません）
# ワールドの作成時とリセット後に、ボーダーの範囲全体をバックグラウンドで生成します。
# 生成中もプレイできます。サーバーを再起動すると続きから再開します。
pregen:
  enabled: true

# リセットの設定（自動実行はしません。管理 GUI またはコマンドから手動で実行します）
reset:
  # 告知のタイミング（リセットまでの秒数）とメッセージ。最も大きい秒数がカウントダウンの長さになります。
  # message を省略すると messages.yml の reset.countdown を使います。MiniMessage 形式で <world> と <time> が使えます。
  # 空のリスト [] にするとカウントダウンなしで実行します。
  countdown:
    - seconds: 300
    - seconds: 60
    - seconds: 10
  # リセット前に Worlds のバックアップ API でバックアップを取るか
  backup: false
  # 対象ワールドのプレイヤーを移動させる待ち時間（秒）。過ぎても残っているプレイヤーはキックします。
  move-timeout-seconds: 30

# ログイン時の扱い
login:
  # リセット前に資源ワールドでログアウトした人の移動先
  #   main-world     : メインワールド側の、資源ワールドへ入る直前にいた場所（記録が無ければスポーン）
  #   resource-spawn : そのワールドのスポーン
  relocate-target: main-world

# 日時の表示
display:
  timezone: "Asia/Tokyo"
  date-format: "yyyy/MM/dd HH:mm"

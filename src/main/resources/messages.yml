# resource-core メッセージ（MiniMessage 形式）
# <prefix> はどのメッセージでも使えます。空文字にするとそのメッセージは送信されません。
prefix: "<gray>[<aqua>資源</aqua>]</gray> "

world-name:
  overworld: "資源オーバーワールド"
  nether: "資源ネザー"
  end: "資源エンド"

time:
  hour: "時間"
  minute: "分"
  second: "秒"
  never: "なし"

state:
  missing: "<red>未作成"
  creating: "<yellow>作成中"
  ready: "<green>稼働中"
  countdown: "<gold>リセット予告中 (残り <time>)"
  resetting: "<red>リセット中"

pregen:
  running: "<yellow>生成中 <percent>%"
  waiting: "<yellow>再開待ち"
  idle: "<gray>なし"
  no-chunky: "<red>Chunky 未導入"

common:
  no-permission: "<prefix><red>権限がありません。"
  player-only: "<prefix><red>このコマンドはプレイヤーのみ実行できます。"
  label-yes: "<green>はい"
  label-no: "<red>いいえ"

main:
  teleporting: "<prefix><green>メインワールドへ戻りました。"
  not-in-resource: "<prefix><yellow>資源ワールドにいるときだけ使えます。"

resource:
  teleporting: "<prefix><green><world>へ移動しました。"
  resetting: "<prefix><red><world>はリセット中です。"
  unavailable: "<prefix><red><world>は現在利用できません。"
  teleport-failed: "<prefix><red>移動に失敗しました。"
  portal-resetting: "<prefix><red>行き先の<world>はリセット中です。"
  portal-unavailable: "<prefix><red>行き先の<world>は現在利用できません。"

login:
  relocated: "<prefix><yellow>あなたがいたワールドはリセットされたため移動しました。"
  respawn-cleared: "<prefix><yellow>リセットされたワールドにあったリスポーン地点を解除しました。"

reset:
  countdown: "<prefix><gold><world>は <yellow><time></yellow> 後にリセットされます。"
  cancelled: "<prefix><green><world>のリセットは中止されました。"
  started: "<prefix><red><world>のリセットを開始します。"
  moved: "<prefix><yellow><world>のリセットのためメインワールドへ移動しました。"
  kicked: "<red><world>のリセットのため切断しました。再接続できます。"
  finished: "<prefix><green><world>のリセットが完了しました。"
  failed: "<prefix><red><world>のリセットに失敗しました。コンソールを確認してください。"
  accepted-countdown: "<prefix><green><world>のリセットを予告しました（<time>後）。"
  accepted-now: "<prefix><green><world>のリセットを即時実行します。"
  skipped-to-now: "<prefix><green><world>のカウントダウンを省略して即時実行します。"
  already-active: "<prefix><yellow><world>はすでにリセット処理中です。"
  world-not-loaded: "<prefix><red><world>はまだ作成されていません。"
  cancel-ok: "<prefix><green><world>のカウントダウンを中止しました。"
  cancel-none: "<prefix><yellow><world>のカウントダウンは行われていません。"
  cancel-too-late: "<prefix><red><world>はすでにリセット中のため中止できません。"

create:
  started: "<prefix><yellow><world>を作成しています…"
  finished: "<prefix><green><world>を作成しました。"
  failed: "<prefix><red><world>の作成に失敗しました。コンソールを確認してください。"
  already-exists: "<prefix><yellow><world>はすでに存在します。"

admin:
  reload-ok: "<prefix><green>設定を再読み込みしました。"
  reload-issues: "<prefix><yellow>設定を再読み込みしました（問題 <count> 件。コンソールを確認してください）。"
  reload-busy: "<prefix><red>リセット処理中は再読み込みできません。"
  seed-toggled: "<prefix><green><world>の seed 変更を <value> <green>にしました。"
  status-header: "<prefix><aqua>── resource-core の状態 ──"
  status-world: "<gray><world> <dark_gray>(<key>)</dark_gray>: <state>"
  status-world-detail: "<gray>  ロード: <loaded> <gray>/ 人数: <white><players></white> / スポーン: <white><spawn></white> / ボーダー半径: <white><border></white> / 事前生成: <pregen> <gray>/ 前回リセット: <white><last_reset></white> / seed 変更: <change_seed>"

travel-gui:
  title: "<dark_aqua>ワールド移動"
  main-name: "<green>メインワールドへ戻る"
  main-lore:
    - "<gray>資源ワールドへ入る直前にいた場所へ戻ります。"
    - "<gray>コマンド: <white>/main"
  world-name: "<aqua><world>へ移動"
  world-lore:
    - "<gray>状態: <state>"
    - "<gray>中にいる人数: <white><players>"


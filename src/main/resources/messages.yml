    - "<gray>状態: <state>"
    - "<gray>ロード済み: <loaded>"
    - "<gray>中にいる人数: <white><players>"
    - "<gray>事前生成: <pregen>"
    - "<gray>前回リセット: <white><last_reset>"
  reset-name: "<red>即時リセット"
  reset-lore:
    - "<gray>確認画面を開きます。"
    - "<gray>確定すると告知カウントダウン後にリセットします。"
  cancel-name: "<yellow>カウントダウンを中止"
  cancel-lore:
    - "<gray>残り <white><time>"
  create-name: "<green>ワールドを作成"
  create-lore:
    - "<gray>クリックで作成します。"
  busy-name: "<gray>処理中"
  busy-lore:
    - "<gray>状態: <state>"
  seed-name: "<yellow>リセット時に seed を変える: <value>"
  seed-lore:
    - "<gray>クリックで切り替えます。"
  teleport-name: "<aqua><world>へ移動"
  teleport-lore:
    - "<gray>クリックでスポーンへ移動します。"
  main-name: "<aqua>メインワールドへ戻る"
  main-lore:
    - "<gray>資源ワールドへ入る直前にいた場所へ戻ります。"
  close-name: "<gray>閉じる"
  confirm-name: "<red>確定"
  confirm-lore:
    - "<gray><world>のリセットを開始します。"
    - "<gray>カウントダウン: <white><time>"
    - "<gray>seed を変える: <value>"
  confirm-info-name: "<gold><world>をリセットしますか？"
  confirm-info-lore:
    - "<gray>中のプレイヤーはメインワールドへ移動します。"
    - "<gray>ワールド内の建築物やアイテムはすべて失われます。"
  back-name: "<green>戻る"

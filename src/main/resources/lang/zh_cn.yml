# resource-core：简体中文（MiniMessage 格式）
# 所有消息都可以使用 <prefix>。留空则不发送该消息。
prefix: "<gray>[<aqua>资源</aqua>]</gray> "

world-name:
  overworld: "资源主世界"
  nether: "资源下界"
  end: "资源末地"

time:
  hour: "小时"
  minute: "分钟"
  second: "秒"
  separator: ""
  never: "无"

state:
  missing: "<red>未创建"
  creating: "<yellow>创建中"
  ready: "<green>运行中"
  countdown: "<gold>重置预告中（剩余 <time>）"
  resetting: "<red>重置中"

pregen:
  running: "<yellow>生成中 <percent>%"
  waiting: "<yellow>等待继续"
  idle: "<gray>无"
  no-chunky: "<red>未安装 Chunky"

common:
  no-permission: "<prefix><red>你没有权限。"
  player-only: "<prefix><red>此命令只能由玩家执行。"
  label-yes: "<green>是"
  label-no: "<red>否"

main:
  teleporting: "<prefix><green>已返回主要世界。"
  not-in-resource: "<prefix><yellow>只能在资源世界中使用。"

resource:
  teleporting: "<prefix><green>已移动到<world>。"
  teleporting-last: "<prefix><green>已移动到<world>中你上次所在的位置。<gray>再次执行可移动到出生点。"
  location-not-saved: "<prefix><yellow>该位置很危险，因此下次前往<world>时将移动到出生点。"
  resetting: "<prefix><red><world>正在重置。"
  unavailable: "<prefix><red><world>目前不可用。"
  teleport-failed: "<prefix><red>移动失败。"
  portal-resetting: "<prefix><red>目的地<world>正在重置。"
  portal-unavailable: "<prefix><red>目的地<world>目前不可用。"

login:
  relocated: "<prefix><yellow>你所在的世界已被重置，因此已将你移动。"
  respawn-cleared: "<prefix><yellow>已清除位于被重置世界中的重生点。"

reset:
  countdown: "<prefix><gold><world>将在 <yellow><time></yellow> 后重置。"
  cancelled: "<prefix><green><world>的重置已取消。"
  started: "<prefix><red>开始重置<world>。"
  moved: "<prefix><yellow>由于<world>正在重置，已将你移动到主要世界。"
  kicked: "<red>由于<world>正在重置，你已断开连接。可以重新连接。"
  finished: "<prefix><green><world>重置完成。"
  failed: "<prefix><red><world>重置失败。请查看控制台。"
  accepted-countdown: "<prefix><green>已预告<world>的重置（<time>后）。"
  accepted-now: "<prefix><green>立即重置<world>。"
  skipped-to-now: "<prefix><green>跳过<world>的倒计时并立即重置。"
  already-active: "<prefix><yellow><world>已在重置中。"
  world-not-loaded: "<prefix><red><world>尚未创建。"
  cancel-ok: "<prefix><green>已取消<world>的倒计时。"
  cancel-none: "<prefix><yellow><world>没有正在进行的倒计时。"
  cancel-too-late: "<prefix><red><world>已在重置中，无法取消。"

create:
  started: "<prefix><yellow>正在创建<world>…"
  finished: "<prefix><green>已创建<world>。"
  failed: "<prefix><red><world>创建失败。请查看控制台。"
  already-exists: "<prefix><yellow><world>已存在。"

admin:
  reload-ok: "<prefix><green>已重新加载设置。"
  reload-issues: "<prefix><yellow>已重新加载设置（<count> 个问题。请查看控制台）。"
  reload-busy: "<prefix><red>重置过程中无法重新加载。"
  seed-toggled: "<prefix><green><world>更换种子的设置已改为 <value><green>。"
  status-header: "<prefix><aqua>── resource-core 状态 ──"
  status-world: "<gray><world> <dark_gray>(<key>)</dark_gray>：<state>"
  status-world-detail: "<gray>  已加载：<loaded> <gray>/ 人数：<white><players></white> / 出生点：<white><spawn></white> / 边界半径：<white><border></white> / 预生成：<pregen> <gray>/ 上次重置：<white><last_reset></white> / 更换种子：<change_seed>"

travel-gui:
  title: "<dark_aqua>世界移动"
  main-name: "<green>返回主要世界"
  main-lore:
    - "<gray>返回进入资源世界前所在的位置。"
    - "<gray>命令：<white>/main"
  world-name: "<aqua>前往<world>"
  world-lore:
    - "<gray>目的地：<white><destination>"
    - "<gray>状态：<state>"
    - "<gray>当前人数：<white><players>"
  destination-last: "上次所在位置 (<x>, <y>, <z>)"
  destination-spawn: "出生点"

gui:
  title: "<dark_aqua>resource-core 管理"
  confirm-title: "<dark_red>确认重置"
  status-name: "<aqua><world>"
  status-lore:
    - "<gray>键名：<white><key>"
    - "<gray>状态：<state>"
    - "<gray>已加载：<loaded>"
    - "<gray>当前人数：<white><players>"
    - "<gray>预生成：<pregen>"
    - "<gray>上次重置：<white><last_reset>"
  reset-name: "<red>重置"
  reset-lore:
    - "<gray>打开确认界面。"
    - "<gray>确定后将在预告倒计时结束时重置。"
  cancel-name: "<yellow>取消倒计时"
  cancel-lore:
    - "<gray>剩余 <white><time>"
  create-name: "<green>创建世界"
  create-lore:
    - "<gray>点击创建。"
  busy-name: "<gray>处理中"
  busy-lore:
    - "<gray>状态：<state>"
  seed-name: "<yellow>重置时更换种子：<value>"
  seed-lore:
    - "<gray>点击切换。"
  teleport-name: "<aqua>前往<world>"
  teleport-lore:
    - "<gray>点击移动到上次所在的位置。"
    - "<gray>没有记录或已在该世界时，移动到出生点。"
  main-name: "<aqua>返回主要世界"
  main-lore:
    - "<gray>返回进入资源世界前所在的位置。"
  close-name: "<gray>关闭"
  confirm-name: "<red>确定"
  confirm-lore:
    - "<gray>开始重置<world>。"
    - "<gray>倒计时：<white><time>"
    - "<gray>更换种子：<value>"
  confirm-info-name: "<gold>要重置<world>吗？"
  confirm-info-lore:
    - "<gray>世界中的玩家将被移动到主要世界。"
    - "<gray>世界内的建筑和物品将全部丢失。"
  back-name: "<green>返回"
